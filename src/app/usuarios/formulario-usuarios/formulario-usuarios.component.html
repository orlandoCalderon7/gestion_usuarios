<div class="form-container">
  <h3>Registro de Nuevo Usuario</h3>
  
  <form>
    <!-- Nuevo campo ID  -->
    <div class="form-group">
      <label for="id">ID de Usuario:</label>
      <input type="number" id="id" placeholder="Ejemplo: 3">
    </div>

    <div class="form-group">
      <label for="nombre">Nombre Completo:</label>
      <input type="text" id="nombre" placeholder="Ejemplo: Juan Pérez">
    </div>

    <div class="form-group">
      <label for="email">Correo Electrónico:</label>
      <input type="email" id="email" placeholder="juan&#64;ejemplo.com">
    </div>

    <div class="form-group">
      <label for="rol">Asignar Rol:</label>
      <select id="rol">
        <option value="cliente">Cliente</option>
        <option value="editor">Editor</option>
        <option value="admin">Administrador</option>
      </select>
    </div>

    <div class="actions">
      <button type="submit" class="btn-save">Guardar Usuario</button>
      <button type="button" class="btn-cancel">Cancelar</button>
    </div>
  </form>
</div>
